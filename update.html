<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Update - Personal ClickUp Manager</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --indigo: #4f46e5; --green: #16a34a; --red: #dc2626; color-scheme: light; }
  html[data-theme="dark"] { --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa3b2; --border: #2b3038; color-scheme: dark; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
  .versions { display: flex; gap: 12px; margin: 0 0 16px; }
  .v { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .v span { display: block; font-size: 12px; color: var(--muted); }
  .v b { font-size: 18px; }
  .folder { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; font-size: 14px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  .status { margin: 16px 0 0; font-size: 14px; line-height: 1.5; min-height: 1.5em; }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }
  ol { margin: 10px 0 0; padding-left: 20px; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .links { margin-top: 16px; font-size: 13px; display: flex; gap: 16px; }
  a { color: var(--indigo); }
  .vers { margin: 14px 0 4px; }
  .vers label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .vers .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  .versRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .versRow select { flex: 1 1 260px; min-width: 200px; font: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title">Update Personal ClickUp Manager</h1>
    <p class="lead" id="lead">Installs the newest version into this extension's folder and restarts it. Your settings, accounts and ClickUp connection are kept.</p>
    <div class="versions">
      <div class="v"><span>Installed</span><b id="current">-</b></div>
      <div class="v"><span>Latest</span><b id="latest">-</b></div>
    </div>
    <p class="folder" id="folderLine"></p>
    <div class="btns">
      <button class="primary" id="installBtn" hidden>Install</button>
      <button class="primary" id="braveBtn" hidden>Open Brave setting</button>
      <button id="pickBtn">Choose folder</button>
      <button id="checkBtn">Check for updates</button>
      <button id="skipBtn">Close</button>
    </div>
    <div class="vers" id="versBox">
      <label for="versSel">Other versions <span class="hint">- install an older one if a new version misbehaves. Your settings are kept.</span></label>
      <div class="versRow">
        <select id="versSel"></select>
        <button id="versBtn">Install this version</button>
      </div>
    </div>
    <p class="status" id="status"></p>
    <ol id="log" hidden></ol>
    <div class="links">
      <a id="notesLink" href="#" target="_blank" rel="noopener" hidden>What's new</a>
      <a id="zipLink" href="#" target="_blank" rel="noopener" hidden>Download the zip instead</a>
    </div>
  </div>
</div>
<script type="module" src="update.js"></script>
</body>
</html>
