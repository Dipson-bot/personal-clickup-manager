<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Floating tracker</title>
<link rel="icon" href="icons/icon16.png" />
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --indigo: #4f46e5; --green: #16a34a; color-scheme: light; }
  html[data-theme="dark"] { --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa3b2; --border: #2b3038; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); cursor: pointer; }
  .card { max-width: 440px; margin: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 26px 26px 22px; text-align: center; }
  h1 { font-size: 19px; margin: 12px 0 6px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 12px; }
  .big { display: inline-block; margin-top: 6px; padding: 11px 20px; border-radius: 10px; background: var(--indigo); color: #fff; font-weight: 600; font-size: 15px; border: 0; cursor: pointer; }
  .small { font-size: 12.5px; }
  button.link { background: none; border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div id="face"></div>
    <h1 id="title">Click anywhere to float your tracker</h1>
    <p id="lead">Your timer will stay on top of every app, so you always see what you're tracking and how close it is to the estimate.</p>
    <div id="action"><span class="big">Float the tracker</span></div>
    <p class="small" id="note" style="margin-top:14px;">Chrome needs one click here to show a window over other apps. Keep this pinned tab open: closing it closes the tracker.</p>
  </div>
<script src="tracker.js"></script>
</body>
</html>
