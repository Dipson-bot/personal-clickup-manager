<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Updating Personal ClickUp Manager…</title>
<link rel="icon" href="icons/icon16.png" />
<style>
  :root { --bg: #f1ece4; --card: #faf7f2; --text: #2e2a26; --muted: #7b7064; --border: #e0d7ca; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa3b2; --border: #2b3038; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .card { max-width: 420px; margin: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; text-align: center; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="t">Installing the update…</h1>
    <p id="s">This tab was opened in the background and closes by itself in a few seconds. You can keep working.</p>
    <button type="button" id="go" hidden style="margin-top:14px;font:inherit;font-size:14px;font-weight:600;padding:10px 20px;border:0;border-radius:10px;background:#4f46e5;color:#fff;cursor:pointer;">Finish update</button>
  </div>
<script type="module" src="auto-update.js"></script>
</body>
</html>
