<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wrap up the day</title>
<style>
  :root {
    --indigo: #4f46e5; --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
    --bg: #f1ece4; --card: #faf7f2; --text: #2e2a26; --muted: #7b7064; --border: #e0d7ca; --bg2: #ece5da;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa3b2; --border: #2b3038; --bg2: #22262e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 16px 40px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
  .wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .card h2 .sp { flex: 1; }
  .prog { display: flex; align-items: baseline; gap: 8px; font-size: 15px; }
  .prog b { font-size: 22px; }
  .bar { height: 8px; border-radius: 99px; background: var(--bg2); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--indigo); border-radius: 99px; }
  .bar.met > i { background: var(--green); }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); text-decoration: none; }
  .row .nm:hover { text-decoration: underline; }
  .row .cl { flex: none; font-size: 11px; color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .ok { flex: none; color: var(--green); font-weight: 600; font-size: 12.5px; }
  button { font: inherit; font-size: 12.5px; font-weight: 600; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 5px 11px; cursor: pointer; }
  button:hover { background: var(--bg2); }
  button:disabled { opacity: .6; cursor: default; }
  button.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  button.primary:hover { filter: brightness(1.08); background: var(--indigo); }
  .empty { color: var(--muted); font-size: 13px; }
  textarea { width: 100%; min-height: 190px; resize: vertical; font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--bg); color: var(--text); }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .actions .hint { color: var(--muted); font-size: 12px; flex: 1; }
  .remind { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .remind label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .remind input[type="time"] { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--text); }
  .remind .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Wrap up the day 📋</h1>
      <div class="sub" id="today"></div>
    </div>

    <div class="card" id="progCard">
      <div class="prog"><b id="tracked">-</b><span id="target"></span></div>
      <div class="bar" id="bar"><i style="width:0"></i></div>
    </div>

    <div class="card">
      <h2><span>Still open, due today</span><span class="sp"></span><button id="moveAll" hidden></button><button id="moveAllDate" hidden title="Pick any day and move all these tasks' due dates there">Move all to date…</button><input type="date" id="moveDate" aria-label="Move all to this date" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;" /></h2>
      <div id="openList"></div>
    </div>

    <div class="card">
      <h2><span>Daily Tasks Update</span><span class="sp"></span><button id="refreshDone" title="Read today's completed tasks from ClickUp again">↻ Refresh</button></h2>
      <textarea id="standup" spellcheck="false"></textarea>
      <div class="actions">
        <span class="hint" id="standupHint">Tasks you completed today, by project. Edit freely - Copy keeps the links clickable in Slack.</span>
        <button id="rebuild" hidden>Rebuild</button>
        <button class="primary" id="copy">Copy</button>
      </div>
    </div>

    <div class="card">
      <h2><span>Reminder</span></h2>
      <div class="remind">
        <label><input type="checkbox" id="remOn" /> Remind me on weekdays at</label>
        <input type="time" id="remAt" />
        <span class="hint" id="remMsg"></span>
      </div>
    </div>
  </div>
<script src="wrapup.js"></script>
</body>
</html>
