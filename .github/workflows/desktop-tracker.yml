# Builds the ClickUp Tracker desktop app for Windows and macOS.
# Pushing a tag desktop-vX.Y.Z builds both and attaches the installers to that
# GitHub release (the extension's "Get the taskbar timer" downloads from it).
# Can also be started by hand (Actions > Desktop tracker build > Run workflow):
# then the installers are only kept as the run's Artifacts.
# The installers are unsigned.
name: Desktop tracker build
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-tracker
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: clickup-tracker-${{ matrix.os }}
          path: |
            desktop-tracker/release/*.exe
            desktop-tracker/release/*.dmg
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ClickUp Tracker ${GITHUB_REF_NAME#desktop-v}" --notes "Taskbar timer for Personal ClickUp Manager." --latest=false || true
          for f in release/ClickUp-Tracker-*.exe release/ClickUp-Tracker-*.dmg; do
            if [ -f "$f" ]; then gh release upload "$GITHUB_REF_NAME" "$f" --clobber; fi
          done
