<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>ClickUp Tracker</title>
<style>
  :root { --bg: #faf7f2; --text: #2e2a26; --muted: #7b7064; --border: #e0d7ca; --track: #ece5da; --field: #fffdf9;
    --blue: #378ADD; --green: #16a34a; --red: #dc2626; --amber: #b45309; --indigo: #4f46e5; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #181b21; --text: #e8eaed; --muted: #9aa3b2; --border: #2b3038; --track: #2b3038; --field: #1f232a;
      --blue: #60a5fa; --green: #22c55e; --red: #f87171; --amber: #fbbf24; color-scheme: dark; }
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 12.5px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); user-select: none; }
  /* The whole card drags the window; controls opt out. */
  #card { position: absolute; inset: 0; box-sizing: border-box; background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 9px 11px; display: flex; align-items: center; gap: 10px; -webkit-app-region: drag; overflow: hidden; }
  button, input, textarea, a, select, .nodrag { -webkit-app-region: no-drag; }
  .face { flex: none; display: grid; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .nm { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); text-decoration: none; cursor: pointer; }
  .nm:hover { text-decoration: underline; }
  .chip { flex: none; max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: rgba(99,102,241,.16); color: #6366f1; }
  @media (prefers-color-scheme: dark) { .chip { color: #a5b4fc; } }
  .trk { flex: 1; height: 7px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .trk b { display: block; height: 100%; border-radius: 999px; transition: width .6s, background .6s; }
  .tm { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .lab { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btns { display: flex; gap: 5px; margin-left: auto; flex: none; }
  button { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--field); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.x { font-size: 11px; padding: 1px 7px; flex: none; }
  button.pri { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  input.xin, textarea.xin { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--field); color: var(--text); }
  input.xin:focus, textarea.xin:focus { outline: 2px solid #6366f1; outline-offset: -1px; }
  #badge { position: absolute; top: 4px; left: 4px; z-index: 5; font: 700 10.5px/1.2 sans-serif; padding: 2px 6px; border-radius: 999px; background: #ef4444; border: 0; color: #fff; }
  #badge[hidden] { display: none; }
  /* bigger view */
  #card.big { display: block; overflow: auto; padding: 12px 14px; user-select: text; -webkit-app-region: no-drag; }
  #card.big .bhead { display: flex; gap: 10px; align-items: flex-start; padding-bottom: 8px; border-bottom: 1px solid var(--border); -webkit-app-region: drag; }
  #card.big .bsec { margin-top: 10px; }
  .bh { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; }
  #card.big textarea.xin { width: 100%; box-sizing: border-box; resize: vertical; min-height: 64px; margin-bottom: 6px; }
  .cmt { padding: 6px 0; border-top: 1px solid var(--border); white-space: normal; line-height: 1.5; }
  .cmt:first-child { border-top: 0; }
  .cmt .when { color: var(--muted); font-size: 11px; }
  .cmt a { color: #6366f1; word-break: break-all; }
  .newtag { font-size: 9.5px; font-weight: 700; padding: 0 5px; border-radius: 999px; background: #ef4444; color: #fff; margin-left: 4px; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .file { font-size: 11.5px; padding: 2px 4px 2px 8px; border: 1px solid var(--border); border-radius: 999px; display: inline-flex; gap: 4px; align-items: center; }
  .file button { border: 0; background: none; padding: 0 3px; }
  .bfoot { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); }
  .err { color: var(--red); white-space: normal; }
  /* on the taskbar: one slim line */
  #card.strip { padding: 2px 6px 2px 8px; gap: 6px; border-radius: 8px; }
  #card.strip .trk { min-width: 70px; }
  #card.strip .tm { font-size: 12px; font-weight: 600; color: var(--text); }
  #card.strip .idle { flex: 1; }
  #card.strip button.x { padding: 0 6px; font-size: 12px; line-height: 18px; }
  #card.strip button.done { color: var(--green); }
  #card.strip button.go { color: var(--green); }
  /* setup */
  #card.setup { display: block; padding: 18px; user-select: text; }
  #card.setup h1 { font-size: 15px; margin: 0 0 6px; -webkit-app-region: drag; }
  #card.setup p { color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
  #card.setup input { width: 100%; box-sizing: border-box; padding: 7px 9px; margin-bottom: 10px; }
</style>
</head>
<body>
  <div id="card"></div>
  <button id="badge" hidden title="New comments from others on this task - click to read"></button>
  <input type="file" id="fileIn" multiple hidden />
  <script src="app.js"></script>
</body>
</html>
